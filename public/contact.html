
<head>
    <title>Contact - My Portfolio</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="bd">
 <div class="nav">
        <div>
        <h1 id="mp">My<br> Portfolio</h1>
        </div>
        <div>
        <nav>
            <a href="/">Home</a> |
            <a href="/about">About</a> |
            <a href="/projects">Projects</a> |
            <a href="/contact">Contact</a>
        </nav>
        </div>
    </div>
    <div class="contact-header">
        <h2 class="text-orange">Get In Touch</h2>
        <p>I'm available for freelance work and full-time positions.</p>
    </div>

    <form id="contactForm" class="contact-card" action="https://formspree.io/f/mojnwpzv" method="post">
        <div class="form-group">
            <label>Name</label>
            <input type="text" name="name" class="neon-input" required placeholder="Caleb Kipkazi">
        </div>
        <div class="form-group">
            <label>Email</label>
            <input type="email" name="email" class="neon-input" required placeholder="caleb@example.com">
        </div>
        <div class="form-group">
            <label>Message</label>
            <textarea name="message" class="neon-input" rows="5" required placeholder="Hello! I have a project for you..."></textarea>
        </div>
        <button type="submit" class="btn-submit">SEND MESSAGE</button>
        <div id="responseMessage" class="mt-3"></div>
    </form>

</body>
<script src="/js/contact.js"></script>
